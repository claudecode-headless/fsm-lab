# chain-probe — X1: the chain-physics probe. Two questions, settled live
# before the conductor relies on either:
#   1. Can a workflow re-trigger ITSELF with its own GITHUB_TOKEN?
#      (X1a ANSWER — YES: repository_dispatch is the documented anti-recursion
#      exception; probe 34025596219 fired run 34025603333 as github-actions[bot].
#      The old header claimed the opposite — a doc inversion caught in T44.)
#   2. Can it with a PAT? (hop latency measured: 15 hops @ 9.2s)
name: chain-probe

run-name: "hop ${{ github.event.client_payload.n || 0 }} · ${{ github.event.client_payload.variant || inputs.variant || 'start' }}"

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'max hops (pat variant)'
        default: '12'
      variant:
        description: 'pat | github-token'
        default: 'pat'
  repository_dispatch:
    types: [chain-probe-next]

concurrency:
  group: chain-probe
  cancel-in-progress: false

permissions:
  contents: write  # the dispatch POST (X1a: this lane WORKS — same-repo chains
                   # need zero PAT)
  actions: read    # run-list query (self-verifying verdict)

jobs:
  hop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Hop
        env:
          LAB_PAT: ${{ secrets.LAB_PAT }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          N: ${{ github.event.client_payload.n || '0' }}
          MAX: ${{ github.event.client_payload.max || inputs.rounds || '12' }}
          VARIANT: ${{ github.event.client_payload.variant || inputs.variant || 'pat' }}
        run: node probe/hop.mjs
