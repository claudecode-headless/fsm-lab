# fsm-conductor — the orchestration loop. One run = one FSM turn
# (a tick, a control command, or a backstop wake), serialized by the
# concurrency group: SINGLE STATE WRITER by construction.
#
# Continuity: every successful turn self-dispatches the next tick via the
# JOB-SCOPED GITHUB_TOKEN (X1a: repository_dispatch IS the anti-recursion
# exception — probe-proven run 34025596219, chain-proven X1c: 15 hops, actor
# github-actions[bot] x14). LAB_PAT stays as the fallback lane only. If a
# link dies, the watchdog re-primes. If everything is done (or held), the
# turn QUIESCES — no commit, no self-dispatch (T44/F2).
#
# Security (the executor contract, PUBLIC repo discipline):
#   triggers = repository_dispatch + workflow_dispatch + schedule ONLY
#   (never issue_comment / pull_request / workflow_run — hostile-input
#   surfaces on a public repo holding a PAT secret).
name: fsm-conductor

run-name: >-
  ${{ github.event_name == 'repository_dispatch' && github.event.action == 'fsm-control'
      && format('control:{0} · conductor', github.event.client_payload.command)
      || github.event_name == 'repository_dispatch'
      && format('{0} · conductor', github.event.client_payload.reason || github.event.action)
      || format('{0} · conductor', github.event_name == 'schedule' && 'schedule-backstop' || github.event_name) }}

on:
  repository_dispatch:
    types: [fsm-tick, fsm-control]
  workflow_dispatch:
    inputs:
      note:
        description: 'manual tick reason (logged only)'
        required: false
        default: ''
  schedule:
    # backstop tick + watchdog prime in one: if the chain is dead AND state
    # is fresh, this is a harmless extra tick; if stale, it re-primes.
    # On a done/held chain this wake QUIESCES (no commit — T44/F2).
    # NOTE (T44 live datum): schedules COLD-START ~3.6h after repo creation
    # and then fire sparsely (~2h apart vs the 10-min nominal) — the chain
    # self-tick is the primary driver; this is the backstop.
    # :08 avoids the :00/:30 high-load schedule minutes.
    - cron: "8,18,28,38,48,58 * * * *"

concurrency:
  group: fsm-conductor
  cancel-in-progress: false

permissions:
  contents: write   # fsm-state branch pushes + repository_dispatch POST (X1a)
  issues: write      # ops-console alert comments (as github-actions[bot])

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # T44/F6: was 5 — the Retry-After-aware dispatch ladder needs the headroom
    steps:
      - uses: actions/checkout@v4

      - name: Conductor turn
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_PAT: ${{ secrets.LAB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EVENT: ${{ toJSON(github.event) }}
          OPS_ISSUE: '1'
        run: node conductor/turn.mjs

      - name: Persist run evidence
        if: always()
        run: echo "conductor run $GITHUB_RUN_ID finished at $(date -u +%FT%TZ)"
